name: Publish supplementary web preview

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supplementary-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test public-data collector and web behavior
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/web.test.mjs tests/main.test.mjs
      - uses: actions/configure-pages@v5
      - name: Collect public data and build supplementary site
        run: python scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
